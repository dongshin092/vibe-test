<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨 대시보드</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2ff 0%, #fdf6ff 100%);
            color: #334155;
        }

        .search-box {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(100, 149, 237, 0.15);
        }

        .weather-card {
            border: none;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 32px rgba(100, 149, 237, 0.2);
        }

        .weather-icon {
            width: 110px;
            height: 110px;
        }

        .info-tile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 20px 12px;
            border-radius: 20px;
            background: #f1f7ff;
            text-align: center;
        }

        .info-tile i {
            font-size: 2rem;
        }

        .info-label {
            font-size: 0.9rem;
            color: #64748b;
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <h1 class="text-center fw-bold mb-4">오늘의 날씨</h1>

                <!-- 검색 영역 -->
                <div class="search-box p-4 mb-4">
                    <div class="row g-2">
                        <div class="col-12 col-sm-8">
                            <select id="citySelect" class="form-select rounded-pill">
                                <option value="Seoul">서울</option>
                                <option value="Busan">부산</option>
                                <option value="Incheon">인천</option>
                                <option value="Daegu">대구</option>
                                <option value="Daejeon">대전</option>
                                <option value="Gwangju">광주</option>
                                <option value="Ulsan">울산</option>
                                <option value="Suwon">수원</option>
                                <option value="Jeju City">제주</option>
                                <option value="Tokyo">도쿄</option>
                                <option value="New York">뉴욕</option>
                                <option value="London">런던</option>
                                <option value="Paris">파리</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-4">
                            <button id="searchBtn" class="btn btn-primary rounded-pill w-100">날씨 검색</button>
                        </div>
                    </div>
                    <p id="message" class="text-danger text-center mt-3 mb-0"></p>
                </div>

                <!-- 날씨 카드 대시보드 -->
                <div id="weatherCard" class="card weather-card d-none">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h2 id="cityName" class="fw-bold mb-0"></h2>
                            <img id="weatherIcon" src="" alt="날씨 아이콘" class="weather-icon">
                            <p id="weatherDesc" class="fs-5 mb-0"></p>
                        </div>

                        <div class="row g-3">
                            <div class="col-6 col-md-4">
                                <div class="info-tile">
                                    <i class="bi bi-thermometer-half text-primary"></i>
                                    <span class="info-label">현재 기온</span>
                                    <span id="temp" class="info-value"></span>
                                </div>
                            </div>
                            <div class="col-6 col-md-4">
                                <div class="info-tile">
                                    <i class="bi bi-droplet-half text-info"></i>
                                    <span class="info-label">습도</span>
                                    <span id="humidity" class="info-value"></span>
                                </div>
                            </div>
                            <div class="col-6 col-md-4">
                                <div class="info-tile">
                                    <i class="bi bi-compass text-success"></i>
                                    <span class="info-label">풍향</span>
                                    <span id="windDir" class="info-value"></span>
                                </div>
                            </div>
                            <div class="col-6 col-md-4">
                                <div class="info-tile">
                                    <i class="bi bi-wind text-secondary"></i>
                                    <span class="info-label">풍속</span>
                                    <span id="windSpeed" class="info-value"></span>
                                </div>
                            </div>
                            <div class="col-6 col-md-4">
                                <div class="info-tile">
                                    <i class="bi bi-thermometer-sun text-danger"></i>
                                    <span class="info-label">최고 기온</span>
                                    <span id="tempMax" class="info-value"></span>
                                </div>
                            </div>
                            <div class="col-6 col-md-4">
                                <div class="info-tile">
                                    <i class="bi bi-thermometer-snow text-primary"></i>
                                    <span class="info-label">최저 기온</span>
                                    <span id="tempMin" class="info-value"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // OpenWeather API Key 입력
        const API_KEY = '2983c7e587b9e5ad52adb2d36044402e';

        const citySelect = document.getElementById('citySelect');
        const searchBtn = document.getElementById('searchBtn');
        const message = document.getElementById('message');
        const weatherCard = document.getElementById('weatherCard');

        // 풍향 각도(0~360)를 16방위로 변환
        function toWindDirection(deg) {
            const dirs = ['북', '북북동', '북동', '동북동', '동', '동남동', '남동', '남남동',
                          '남', '남남서', '남서', '서남서', '서', '서북서', '북서', '북북서'];
            return dirs[Math.round(deg / 22.5) % 16];
        }

        async function getWeather() {
            const city = citySelect.value;
            message.textContent = '';

            if (!API_KEY) {
                message.textContent = '스크립트의 API_KEY 변수에 키를 입력하세요.';
                return;
            }

            const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=kr`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!res.ok) {
                    message.textContent = `오류: ${data.message}`;
                    weatherCard.classList.add('d-none');
                    return;
                }

                document.getElementById('cityName').textContent = citySelect.options[citySelect.selectedIndex].text;
                document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
                document.getElementById('weatherDesc').textContent = data.weather[0].description;
                document.getElementById('temp').textContent = `${data.main.temp.toFixed(1)}°C`;
                document.getElementById('humidity').textContent = `${data.main.humidity}%`;
                document.getElementById('windDir').textContent = toWindDirection(data.wind.deg);
                document.getElementById('windSpeed').textContent = `${data.wind.speed} m/s`;
                document.getElementById('tempMax').textContent = `${data.main.temp_max.toFixed(1)}°C`;
                document.getElementById('tempMin').textContent = `${data.main.temp_min.toFixed(1)}°C`;

                weatherCard.classList.remove('d-none');
            } catch (err) {
                message.textContent = '날씨 정보를 불러오지 못했습니다.';
                weatherCard.classList.add('d-none');
            }
        }

        searchBtn.addEventListener('click', getWeather);
    </script>
</body>
</html>
