<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로또 번호 생성기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="container app-container mx-auto py-4 px-3">

    <!-- ① 헤더 -->
    <header class="d-flex align-items-center gap-3 mb-4">
      <div class="logo-box" aria-hidden="true"><i class="bi bi-suit-club-fill"></i></div>
      <div>
        <h1 class="app-title mb-0">로또 번호 생성기</h1>
        <p class="app-subtitle mb-0">고정할 번호와 뺄 번호를 고르고 생성을 눌러보세요</p>
      </div>
    </header>

    <!-- ② 분할 선택판 -->
    <section class="row g-3" aria-label="번호 선택">
      <div class="col-12 col-md-6">
        <div class="card panel h-100">
          <div class="card-body">
            <div class="panel-header">
              <h2 class="panel-title"><i class="bi bi-pin-angle text-fixed" aria-hidden="true"></i>고정 번호</h2>
              <span class="count-badge badge-fixed" id="fixedCount">0 / 5</span>
            </div>
            <div class="num-grid" id="fixedBoard" role="group" aria-label="고정 번호 선택판"></div>
            <div class="panel-footer">
              <span>모든 세트에 포함</span>
              <button type="button" class="btn btn-link link-btn" id="resetFixedBtn">
                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> 초기화
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card panel h-100">
          <div class="card-body">
            <div class="panel-header">
              <h2 class="panel-title"><i class="bi bi-slash-circle text-excluded" aria-hidden="true"></i>제외 번호</h2>
              <span class="count-badge badge-excluded" id="excludedCount">0 / 39</span>
            </div>
            <div class="num-grid" id="excludedBoard" role="group" aria-label="제외 번호 선택판"></div>
            <div class="panel-footer">
              <span>생성에서 제외</span>
              <button type="button" class="btn btn-link link-btn" id="resetExcludedBtn">
                <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> 초기화
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ③ 액션 버튼 -->
    <section class="actions">
      <button type="button" class="btn btn-primary btn-generate" id="generateBtn">
        <i class="bi bi-stars" aria-hidden="true"></i> 번호 생성하기 (5세트)
      </button>
      <button type="button" class="btn btn-outline-secondary btn-reset-all" id="resetAllBtn">
        <i class="bi bi-arrow-counterclockwise" aria-hidden="true"></i> 전체 초기화
      </button>
    </section>
    <p class="error-msg" id="errorMsg" role="alert"></p>

    <!-- ④ 생성 결과 -->
    <section class="card panel" aria-label="생성 결과">
      <div class="card-body">
        <div class="panel-header">
          <h2 class="panel-title"><i class="bi bi-list-ol" aria-hidden="true"></i>생성 결과</h2>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-link link-btn" id="copyAllBtn">
              <i class="bi bi-copy" aria-hidden="true"></i> <span>전체 복사</span>
            </button>
            <button type="button" class="btn btn-link link-btn link-danger" id="resetResultsBtn">
              <i class="bi bi-trash" aria-hidden="true"></i> 결과 초기화
            </button>
          </div>
        </div>
        <div id="results" aria-live="polite"></div>
      </div>
    </section>

  </main>
</body>
</html>
